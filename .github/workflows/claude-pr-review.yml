name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR_NUMBER: ${{ github.event.pull_request.number }}

            이 PR의 변경사항을 리뷰해주세요. 다음 항목에 집중해주세요:
            - 버그 또는 잠재적 이슈
            - 보안 취약점
            - 코드 품질 및 모범 사례
            - 성능 고려사항

            PR 브랜치가 현재 작업 디렉토리에 체크아웃되어 있습니다.

            `gh pr comment`로 전체적인 피드백을 남기고,
            `mcp__github_inline_comment__create_inline_comment`으로 특정 코드 라인에 인라인 코멘트를 남겨주세요.
            GitHub 코멘트로만 피드백을 남기세요. 한국어로 작성해주세요.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
